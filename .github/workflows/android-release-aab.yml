name: Android Release AAB

on:
  workflow_dispatch:
    inputs:
      confirm_production_rewarded_release:
        description: Confirm the approved production Rewarded release configuration
        required: true
        type: boolean
        default: false
      release_mode:
        description: Select the approved production release or internal diagnostic AAB mode
        required: true
        type: choice
        options:
          - production
          - internal_diagnostic
        default: production
      confirm_internal_diagnostic_aab:
        description: Confirm the approved internal diagnostic AAB configuration
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android-release-aab:
    if: ${{ inputs.release_mode == 'production' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate manual production release authorization
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          OWNER_CONFIRMED: ${{ inputs.confirm_production_rewarded_release }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/main" ]; then
            echo "::error::Android production release must run from main"
            exit 1
          fi
          if [ "$OWNER_CONFIRMED" != "true" ]; then
            echo "::error::Owner confirmation is required for the production Rewarded release"
            exit 1
          fi

      - name: Validate release signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done

      - name: Validate Rewarded provider invariants
        run: npm run check:admob-rewarded-provider

      - name: Validate production Rewarded release configuration
        run: node scripts/checkAdmobRewardedAdProvider.mjs --release-env-preflight
        env:
          VITE_REWARDED_AD_PROVIDER: sdk
          VITE_REWARDED_AD_SDK_ENABLED: "true"
          VITE_REWARDED_AD_MODE: production
          VITE_REWARDED_AD_BUILD_TARGET: release
          VITE_REWARDED_AD_UNIT_ID: ${{ secrets.ADMOB_REWARDED_PRODUCTION_AD_UNIT_ID }}

      - name: Build web app
        run: npm run build
        env:
          VITE_REWARDED_AD_PROVIDER: sdk
          VITE_REWARDED_AD_SDK_ENABLED: "true"
          VITE_REWARDED_AD_MODE: production
          VITE_REWARDED_AD_BUILD_TARGET: release
          VITE_REWARDED_AD_UNIT_ID: ${{ secrets.ADMOB_REWARDED_PRODUCTION_AD_UNIT_ID }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Sync Android project
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release-keystore.jks"
          test -s "$RUNNER_TEMP/android-signing/release-keystore.jks"

      - name: Build signed release AAB
        working-directory: android
        run: ./gradlew bundleRelease
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/android-signing/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify signed release AAB
        working-directory: android
        shell: bash
        run: |
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB_PATH"
          jarsigner -verify "$AAB_PATH" > "$RUNNER_TEMP/android-signing/jarsigner-result.txt"
          cat "$RUNNER_TEMP/android-signing/jarsigner-result.txt"
          grep -q "jar verified." "$RUNNER_TEMP/android-signing/jarsigner-result.txt"

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: harupuli-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  android-internal-diagnostic-aab:
    if: ${{ inputs.release_mode == 'internal_diagnostic' }}
    runs-on: ubuntu-latest
    env:
      EXPECTED_ANDROID_SIGNING_CERT_SHA1: "DD25442AA42051B9191DD695B932A319A750A876"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate internal diagnostic build authorization
        shell: bash
        env:
          DIAGNOSTIC_REF: ${{ github.ref }}
          OWNER_CONFIRMED: ${{ inputs.confirm_internal_diagnostic_aab }}
        run: |
          if [ "$DIAGNOSTIC_REF" != "refs/heads/build/admob-diagnostic-v1.0.4-signed-aab-workflow" ]; then
            echo "::error::Internal diagnostic AAB must run from the approved diagnostic branch"
            exit 1
          fi
          if [ "$OWNER_CONFIRMED" != "true" ]; then
            echo "::error::Owner confirmation is required for the internal diagnostic AAB"
            exit 1
          fi

      - name: Validate internal diagnostic test device secret
        shell: bash
        env:
          ADMOB_DIAGNOSTIC_TEST_DEVICE_ID: ${{ secrets.ADMOB_DIAGNOSTIC_TEST_DEVICE_ID }}
        run: |
          if [ -z "$ADMOB_DIAGNOSTIC_TEST_DEVICE_ID" ]; then
            echo "::error::ADMOB_DIAGNOSTIC_TEST_DEVICE_ID is not configured"
            exit 1
          fi
          if ! [[ "$ADMOB_DIAGNOSTIC_TEST_DEVICE_ID" =~ ^[A-F0-9]{32}$ ]]; then
            echo "::error::ADMOB_DIAGNOSTIC_TEST_DEVICE_ID must be an uppercase 32-character SDK test-device hash"
            exit 1
          fi

      - name: Validate diagnostic Android version
        shell: bash
        run: |
          VERSION_CODE_MATCHES="$(grep -Ec '^[[:space:]]*versionCode[[:space:]]+5[[:space:]]*$' android/app/build.gradle)"
          VERSION_NAME_MATCHES="$(grep -Ec '^[[:space:]]*versionName[[:space:]]+"1\.0\.4"[[:space:]]*$' android/app/build.gradle)"
          if [ "$VERSION_CODE_MATCHES" -ne 1 ] || [ "$VERSION_NAME_MATCHES" -ne 1 ]; then
            echo "::error::Internal diagnostic AAB requires Android versionCode 5 and versionName 1.0.4"
            exit 1
          fi

      - name: Validate diagnostic signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done

      - name: Validate Rewarded provider invariants for diagnostic AAB
        run: npm run check:admob-rewarded-provider

      - name: Validate AdMob runtime consent coordinator for diagnostic AAB
        run: npm run check:admob-runtime-consent-coordinator

      - name: Validate diagnostic production Rewarded configuration
        run: node scripts/checkAdmobRewardedAdProvider.mjs --release-env-preflight
        env:
          VITE_REWARDED_AD_PROVIDER: "sdk"
          VITE_REWARDED_AD_SDK_ENABLED: 'true'
          VITE_REWARDED_AD_MODE: "production"
          VITE_REWARDED_AD_BUILD_TARGET: "release"
          VITE_REWARDED_AD_UNIT_ID: "${{ secrets.ADMOB_REWARDED_PRODUCTION_AD_UNIT_ID }}"
          VITE_ADMOB_DIAGNOSTIC_TEST_DEVICE_REGISTRATION: enabled
          VITE_ADMOB_DIAGNOSTIC_TEST_DEVICE_ID: ${{ secrets.ADMOB_DIAGNOSTIC_TEST_DEVICE_ID }}

      - name: Build diagnostic web app
        run: npm run build
        env:
          VITE_REWARDED_AD_PROVIDER: "sdk"
          VITE_REWARDED_AD_SDK_ENABLED: 'true'
          VITE_REWARDED_AD_MODE: "production"
          VITE_REWARDED_AD_BUILD_TARGET: "release"
          VITE_REWARDED_AD_UNIT_ID: "${{ secrets.ADMOB_REWARDED_PRODUCTION_AD_UNIT_ID }}"
          VITE_ADMOB_DIAGNOSTIC_TEST_DEVICE_REGISTRATION: enabled
          VITE_ADMOB_DIAGNOSTIC_TEST_DEVICE_ID: ${{ secrets.ADMOB_DIAGNOSTIC_TEST_DEVICE_ID }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Sync Android project
        run: npx cap sync android

      - name: Verify diagnostic Android manifest permissions
        working-directory: android
        shell: bash
        run: |
          MANIFEST_PATH="app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "::error::Diagnostic manifest permission verification failed"
            exit 1
          fi
          AD_ID_COUNT="$(grep -c 'com\.google\.android\.gms\.permission\.AD_ID' "$MANIFEST_PATH" || true)"
          INTERNET_COUNT="$(grep -c 'android\.permission\.INTERNET' "$MANIFEST_PATH" || true)"
          if [ "$AD_ID_COUNT" -ne 1 ] || [ "$INTERNET_COUNT" -lt 1 ]; then
            echo "::error::Diagnostic manifest permission verification failed"
            exit 1
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Restore diagnostic release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release-keystore.jks"
          test -s "$RUNNER_TEMP/android-signing/release-keystore.jks"

      - name: Verify restored diagnostic keystore certificate
        shell: bash
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/android-signing/release-keystore.jks"
          CALCULATED_SHA1="$(keytool -list -v \
            -keystore "$KEYSTORE_PATH" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            2>/dev/null \
            | grep -E '^[[:space:]]*SHA1:' \
            | head -n1 \
            | sed -E 's/^[[:space:]]*SHA1:[[:space:]]*//' \
            | tr -d ':' \
            | tr '[:lower:]' '[:upper:]')"
          if [ -z "$CALCULATED_SHA1" ]; then
            echo "::error::Diagnostic keystore certificate verification failed"
            exit 1
          fi
          if [ "$CALCULATED_SHA1" != "$EXPECTED_ANDROID_SIGNING_CERT_SHA1" ]; then
            echo "::error::Diagnostic keystore certificate verification failed"
            exit 1
          fi
          unset CALCULATED_SHA1

      - name: Build signed internal diagnostic AAB
        working-directory: android
        run: ./gradlew bundleRelease
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/android-signing/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify signed internal diagnostic AAB
        working-directory: android
        shell: bash
        run: |
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB_PATH"
          jarsigner -verify "$AAB_PATH" > "$RUNNER_TEMP/android-signing/jarsigner-result.txt"
          cat "$RUNNER_TEMP/android-signing/jarsigner-result.txt"
          grep -q "jar verified." "$RUNNER_TEMP/android-signing/jarsigner-result.txt"

      - name: Verify generated diagnostic AAB certificate
        working-directory: android
        shell: bash
        run: |
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          CALCULATED_SHA1="$(keytool -printcert -jarfile "$AAB_PATH" \
            2>/dev/null \
            | grep -E '^[[:space:]]*SHA1:' \
            | head -n1 \
            | sed -E 's/^[[:space:]]*SHA1:[[:space:]]*//' \
            | tr -d ':' \
            | tr '[:lower:]' '[:upper:]')"
          if [ -z "$CALCULATED_SHA1" ]; then
            echo "::error::Diagnostic AAB certificate verification failed"
            exit 1
          fi
          if [ "$CALCULATED_SHA1" != "$EXPECTED_ANDROID_SIGNING_CERT_SHA1" ]; then
            echo "::error::Diagnostic AAB certificate verification failed"
            exit 1
          fi
          unset CALCULATED_SHA1

      - name: Verify diagnostic AAB contains AD_ID permission
        working-directory: android
        shell: bash
        run: |
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          PERMISSIONS_PATH="$RUNNER_TEMP/android-signing/built-aab-permissions.txt"
          APKANALYZER_BIN=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" \
            "$ANDROID_HOME/tools/bin/apkanalyzer" \
            "$ANDROID_SDK_ROOT/tools/bin/apkanalyzer"; do
            if [ -x "$candidate" ]; then
              APKANALYZER_BIN="$candidate"
              break
            fi
          done
          if [ -z "$APKANALYZER_BIN" ]; then
            echo "::error::Diagnostic AAB manifest verification failed"
            rm -f "$PERMISSIONS_PATH"
            exit 1
          fi
          if ! "$APKANALYZER_BIN" manifest permissions "$AAB_PATH" \
            > "$PERMISSIONS_PATH" 2>/dev/null; then
            echo "::error::Diagnostic AAB manifest verification failed"
            rm -f "$PERMISSIONS_PATH"
            exit 1
          fi
          AD_ID_MATCHES="$(grep -Fxc \
            'com.google.android.gms.permission.AD_ID' \
            "$PERMISSIONS_PATH" || true)"
          INTERNET_MATCHES="$(grep -Fxc \
            'android.permission.INTERNET' \
            "$PERMISSIONS_PATH" || true)"
          if [ "$AD_ID_MATCHES" -ne 1 ] || [ "$INTERNET_MATCHES" -lt 1 ]; then
            echo "::error::Diagnostic AAB manifest verification failed"
            rm -f "$PERMISSIONS_PATH"
            exit 1
          fi
          rm -f "$PERMISSIONS_PATH"

      - name: Upload internal diagnostic AAB
        uses: actions/upload-artifact@v4
        with:
          name: harupuli-internal-diagnostic-aab-vc5
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
